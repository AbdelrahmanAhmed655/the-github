<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Actions Lab</title>
    <style>
      :root {
        --bg: #0d1117;
        --panel: #161b22;
        --border: #30363d;
        --text: #e6edf3;
        --muted: #8b949e;
        --accent: #2f81f7;
        --ok: #3fb950;
      }
      * { box-sizing: border-box; }
      body {
        margin: 0;
        padding: 32px 16px;
        background: var(--bg);
        color: var(--text);
        font: 16px/1.5 -apple-system, BlinkMacSystemFont, "Segoe UI", Helvetica, Arial, sans-serif;
      }
      main { max-width: 680px; margin: 0 auto; }
      h1 { font-size: 24px; margin: 0 0 4px; }
      .sub { color: var(--muted); margin: 0 0 28px; }
      section {
        background: var(--panel);
        border: 1px solid var(--border);
        border-radius: 10px;
        padding: 20px;
        margin-bottom: 20px;
      }
      h2 { font-size: 15px; text-transform: uppercase; letter-spacing: .06em; color: var(--muted); margin: 0 0 14px; }
      .row { display: flex; gap: 8px; flex-wrap: wrap; }
      input, select, button {
        font: inherit;
        padding: 8px 12px;
        border-radius: 6px;
        border: 1px solid var(--border);
        background: #0d1117;
        color: var(--text);
      }
      input { flex: 1 1 140px; min-width: 0; }
      button { background: var(--accent); border-color: var(--accent); color: #fff; cursor: pointer; }
      button:hover { filter: brightness(1.1); }
      button.ghost { background: transparent; border-color: var(--border); color: var(--muted); }
      ul { list-style: none; padding: 0; margin: 14px 0 0; }
      li {
        display: flex; align-items: center; gap: 10px;
        padding: 9px 0; border-top: 1px solid var(--border);
      }
      li span { flex: 1; }
      li.done span { color: var(--muted); text-decoration: line-through; }
      .out {
        margin-top: 14px; padding: 10px 12px; border-radius: 6px;
        background: #0d1117; border: 1px solid var(--border);
        font-family: ui-monospace, SFMono-Regular, Menlo, monospace; font-size: 14px;
        color: var(--ok); white-space: pre-wrap; word-break: break-all;
      }
      .empty { color: var(--muted); margin: 14px 0 0; }
    </style>
  </head>
  <body>
    <main>
      <h1>Actions Lab</h1>
      <p class="sub">A small Node.js app to practise GitHub Actions workflows on.</p>

      <section>
        <h2>Health</h2>
        <button id="ping">GET /health</button>
        <div class="out" id="health">click to call the endpoint</div>
      </section>

      <section>
        <h2>Calculator</h2>
        <div class="row">
          <input id="a" type="number" value="6" aria-label="first operand" />
          <select id="op" aria-label="operation">
            <option value="add">+</option>
            <option value="subtract">−</option>
            <option value="multiply" selected>×</option>
            <option value="divide">÷</option>
          </select>
          <input id="b" type="number" value="7" aria-label="second operand" />
          <button id="calc">Calculate</button>
        </div>
        <div class="out" id="result">—</div>
      </section>

      <section>
        <h2>Todos</h2>
        <form class="row" id="form">
          <input id="title" placeholder="What are you learning?" required />
          <button type="submit">Add</button>
        </form>
        <ul id="list"></ul>
        <p class="empty" id="empty">No todos yet.</p>
      </section>
    </main>

    <script>
      const $ = (id) => document.getElementById(id);

      async function api(method, path, body) {
        const res = await fetch(path, {
          method,
          headers: body ? { 'content-type': 'application/json' } : undefined,
          body: body ? JSON.stringify(body) : undefined,
        });
        return res.json();
      }

      $('ping').onclick = async () => {
        $('health').textContent = JSON.stringify(await api('GET', '/health'), null, 2);
      };

      $('calc').onclick = async () => {
        const params = new URLSearchParams({
          op: $('op').value,
          a: $('a').value,
          b: $('b').value,
        });
        const data = await api('GET', '/api/calc?' + params);
        $('result').textContent = data.error ? 'Error: ' + data.error : String(data.result);
      };

      async function render() {
        const { todos } = await api('GET', '/api/todos');
        $('empty').hidden = todos.length > 0;
        $('list').replaceChildren(...todos.map((todo) => {
          const li = document.createElement('li');
          li.className = todo.done ? 'done' : '';

          const box = document.createElement('input');
          box.type = 'checkbox';
          box.checked = todo.done;
          box.onchange = async () => {
            await api('POST', `/api/todos/${todo.id}/toggle`);
            render();
          };

          const label = document.createElement('span');
          label.textContent = todo.title;

          const del = document.createElement('button');
          del.className = 'ghost';
          del.textContent = 'Delete';
          del.onclick = async () => {
            await api('DELETE', `/api/todos/${todo.id}`);
            render();
          };

          li.append(box, label, del);
          return li;
        }));
      }

      $('form').onsubmit = async (event) => {
        event.preventDefault();
        await api('POST', '/api/todos', { title: $('title').value });
        $('title').value = '';
        render();
      };

      render();
    </script>
  </body>
</html>
