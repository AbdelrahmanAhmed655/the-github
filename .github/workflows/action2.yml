name: Greeting

on:
  push:
  workflow_dispatch:
    inputs:
      name:
        description: Who to greet
        default: World

jobs:
  greet:
    runs-on: ubuntu-latest
    steps:
      # Local actions must be checked out before they can be used
      - uses: actions/checkout@v5

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: npm   # remove this line if the repo has no package-lock.json

      - run: npm ci
      - run: npm test

      - name: Say hello
        id: hello
        uses: ./.github/actions/greeting
        with:
          who-to-greet: ${{ github.event.inputs.name || github.actor }}

      - name: Show output
        run: echo "Greeted at ${{ steps.hello.outputs.time }}"