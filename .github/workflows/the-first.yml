name: Star Event Workflow

on:
  watch:
    types: [started]   # runs when someone stars the repo

jobs:
  log-star-event:
    runs-on: ubuntu-latest
    steps:
    # this action check the repo
      - name: checkout the repo
        uses: actions/checkout@v3
            
      - name: Log the star event
        run: |
          echo "⭐ ${{ github.actor }} starred ${{ github.repository }}"
          echo "Action: ${{ github.event.action }}"